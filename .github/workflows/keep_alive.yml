name: Keep Render Backend Awake

on:
  schedule:
    # Run every 10 minutes to prevent Render free instance from sleeping (spins down after 15m)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Endpoint
        run: |
          RENDER_URL="${{ secrets.RENDER_BACKEND_URL || 'https://sehat-sywu.onrender.com' }}"
          echo "Pinging $RENDER_URL/ping"
          curl -s "$RENDER_URL/ping" || true
